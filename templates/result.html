<!DOCTYPE html>
<html>
<head>
    <title>Route Analytics</title>

    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
        }

        .analytics-page {
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #22d3ee;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .card h2 {
            color: #22d3ee;
        }

        /* SAFE BOX */
        .safe-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(6,182,212,0.1);
            border: 1px solid #06b6d4;
        }

        /* ROUTE OPTIONS */
        .route-option {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
        }

        .safe {
            background: rgba(34,197,94,0.2);
            border-left: 5px solid #22c55e;
        }

        .risky {
            background: rgba(239,68,68,0.2);
            border-left: 5px solid #ef4444;
        }

        /* LEGEND */
        .legend {
            margin-top: 10px;
            font-size: 14px;
            color: #cbd5f5;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            flex: 1;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
        }

        .gauge {
            width: 200px;
            height: 100px;
            border-top: 8px solid #334155;
            border-radius: 100px 100px 0 0;
            margin: auto;
            position: relative;
        }

        #needle {
            width: 4px;
            height: 80px;
            background: #22d3ee;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom;
        }

        .heatmap-box {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .high { background: red; }
        .low { background: green; }
    </style>
</head>

<body>

<div class="analytics-page">

    <div class="header">
        <h1>📊 SafeRoute AI — Analytics Dashboard</h1>
        <p id="routeText"></p>
    </div>

    <div id="kpiGrid" class="kpi-grid"></div>

    <!-- SAFE RECOMMENDATION -->
    <div class="safe-box">
        🛡️ Recommended Safe Travel:
        <br>
        Travel during <b id="safeTime"></b> using <b id="safeTransport"></b>
    </div>

    <!-- ROUTE OPTIONS -->
    <div class="route-option safe">✅ Route B (Safer Recommended)</div>
    <div class="route-option risky">❌ Route A (Avoid - Risky Area)</div>

    <!-- LEGEND -->
    <div class="legend">
        🟢 Safe &nbsp;&nbsp; 🟡 Moderate &nbsp;&nbsp; 🔴 Risky
    </div>

    <!-- CHART + GAUGE -->
    <div class="row">

        <div class="panel">
            <h3>Performance Metrics</h3>
            <canvas id="chart"></canvas>
        </div>

        <div class="panel">
            <h3>Safety Gauge</h3>
            <div class="gauge">
                <div id="needle"></div>
            </div>
            <p id="gaugeText"></p>
        </div>

    </div>

    <!-- HEATMAP -->
    <div class="row">
        <div class="panel">
            <h3>Crowd Heatmap</h3>
            <div id="heatmapBox" class="heatmap-box"></div>
        </div>

        <div class="panel">
            <h3>🧠 AI Insight</h3>
            <p id="insightText"></p>
        </div>
    </div>

</div>

<script>
let params = new URLSearchParams(window.location.search);

let source = params.get("source");
let destination = params.get("destination");
let time = params.get("time");

document.getElementById("routeText").innerText =
    `${source} → ${destination} (${time})`;

fetch("/route", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({source, destination, time})
})
.then(res => res.json())
.then(data => {

    if (!data.score) {
        document.body.innerHTML = "<h2>⚠ No data available</h2>";
        return;
    }

    // KPI
    document.getElementById("kpiGrid").innerHTML = `
        <div class="card"><h2>${data.score}</h2><p>Safety Score</p></div>
        <div class="card"><h2>${data.risk}</h2><p>Risk Level</p></div>
        <div class="card"><h2>${data.crowd}</h2><p>Crowd Density</p></div>
        <div class="card"><h2>${data.transport}</h2><p>Transport</p></div>
    `;

    // ✅ SAFE LOGIC (FIXED)
    let safeTime = data.score < 60 ? "Day" : time;
    let safeTransport = data.transport;

    document.getElementById("safeTime").innerText = safeTime;
    document.getElementById("safeTransport").innerText = safeTransport;

    // Chart
    new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
            labels: ["Safety", "Crowd", "Risk"],
            datasets: [{
                data: [
                    data.score,
                    data.crowd === "High" ? 80 : 40,
                    data.risk === "Safe" ? 30 : data.risk === "Moderate" ? 60 : 90
                ],
                backgroundColor: "#22d3ee"
            }]
        }
    });

    // Gauge
    let angle = data.score * 1.8;
    document.getElementById("needle").style.transform = `rotate(${angle}deg)`;
    document.getElementById("gaugeText").innerText = `Safety Score: ${data.score}`;

    // Heatmap
    let heatmap = document.getElementById("heatmapBox");

    if (data.crowd === "High") {
        heatmap.className = "heatmap-box high";
        heatmap.innerText = "🔴 High Crowd";
    } else {
        heatmap.className = "heatmap-box low";
        heatmap.innerText = "🟢 Low Crowd";
    }

    // Insight
    document.getElementById("insightText").innerHTML =
        `This route is <b>${data.risk}</b>.
         Travel during <b>${safeTime}</b> is safer.
         Recommended transport: <b>${data.transport}</b>.`;
});
</script>

</body>
</html>
